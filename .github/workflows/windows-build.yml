name: Windows build

# Full CopperAI (KiCad 10) Windows build on the self-hosted runner.
#
# Why self-hosted: a GitHub-hosted windows runner gives 4 vCPU / 16 GB RAM /
# ~14 GB disk with a 6 hour job cap. This build needs roughly 20 GB (source tree
# ~2 GB, vcpkg_installed ~3 GB, RelWithDebInfo build tree ~12-15 GB) and a cold
# dependency build takes hours even on 24 cores. It does not fit.
#
# The runner must have: VS 2022 Build Tools, CMake >= 3.28, Ninja, Python, Git,
# a vcpkg checkout, and ~100 GB free.
#
# VCPKG_BINARY_SOURCES is what makes this sustainable -- without a persistent
# binary cache every run rebuilds all 133 dependencies from source.

on:
  pull_request:
  push:
    branches: [main, copperai-release]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      package_msi:
        description: 'Build the MSI installer'
        type: boolean
        default: false

env:
  # VCPKG_ROOT / VCPKG_BINARY_SOURCES / SWIG_DIR are deliberately NOT set here.
  # They are machine-scope environment variables on the runner (see
  # tools/ci/setup-build-box.md), so the runner already inherits them and the
  # workflow does not have to encode one machine's disk layout. Setting them
  # here would override the real values -- this box keeps vcpkg on E:, not C:.
  #
  # 8-core runner: leave a core for the OS. Raising this past the core count
  # buys nothing and increases peak memory.
  VCPKG_MAX_CONCURRENCY: '8'
  BUILD_DIR: build/copperai-win64
  TRIPLET: x64-windows
  # Ninja defaults to cores+2, which exhausts commit charge while eeschema's
  # large translation units build with precompiled headers (C3859 / C1076).
  # Budget 1-2 GB per concurrent cl.exe.
  BUILD_JOBS: '8'

jobs:
  build:
    name: Build CopperAI (x64)
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 600

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # CreateGitVersionHeader.cmake needs real history

      # Resolve the MSVC install rather than hardcoding an edition path. This
      # runner has Build Tools, not Community, and those live under different
      # directories -- a hardcoded path fails on every box but the author's.
      - name: Resolve toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found -- is Visual Studio installed?" }
          $vc = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          if (-not $vc) { throw "no VS install with the C++ toolset (VCTools workload missing?)" }
          $vcvars = "$vc\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          "VCVARS=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "vcvars : $vcvars"

          if (-not $env:VCPKG_ROOT) { throw "VCPKG_ROOT is not set on this runner" }
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) { throw "no vcpkg.exe at $env:VCPKG_ROOT" }
          "vcpkg  : $env:VCPKG_ROOT"
          "cache  : $env:VCPKG_BINARY_SOURCES"
          "swig   : $env:SWIG_DIR"

          cmake --version | Select-Object -First 1
          "ninja  : $(ninja --version)"
          # Report the drive the build actually lives on, not always C:.
          $drive = (Resolve-Path .).Path.Substring(0,1)
          "free on ${drive}: {0:N1} GB" -f ((Get-PSDrive $drive).Free/1GB)

      # Upstream projects relocate their release archives, and when they do the
      # port's recorded URL 404s and every clean build fails until someone
      # diagnoses it. ngspice 45.2 moved to a SourceForge `old-releases` path and
      # broke both machines this has been built on. Staging the file (SHA512
      # verified against the portfile) makes vcpkg skip the dead URL.
      - name: Pre-stage relocated source archives
        shell: pwsh
        run: python tools/ci/prefetch_distfiles.py "$env:VCPKG_ROOT\downloads"

      # Install dependencies as an explicit step rather than letting the CMake
      # configure trigger it, so the usr/local repair below can run in between.
      - name: vcpkg install dependencies
        id: deps
        shell: pwsh
        continue-on-error: true
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --x-manifest-root=. `
            --x-install-root="$env:BUILD_DIR/vcpkg_installed" `
            --overlay-triplets=tools/custom_vcpkg_triplets `
            --triplet $env:TRIPLET

      # Some autotools ports install under a bogus /usr/local prefix; vcpkg then
      # believes they are installed while consumers cannot find them. This
      # recurs on any ABI change, so it is a normal pipeline step, not a hack.
      # See tools/ci/fix_vcpkg_usrlocal_prefix.py for the full explanation.
      - name: Repair vcpkg usr/local prefix
        shell: pwsh
        run: python tools/ci/fix_vcpkg_usrlocal_prefix.py "$env:BUILD_DIR/vcpkg_installed"

      # gettext races under parallel make: gettext-tools links libintl.la from
      # gettext-runtime before that directory is built. Retrying serially is the
      # known workaround, and it only costs time when the fast path already failed.
      - name: Retry dependencies (serial) if the first pass failed
        if: steps.deps.outcome == 'failure'
        shell: pwsh
        env:
          VCPKG_MAX_CONCURRENCY: '1'
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --x-manifest-root=. `
            --x-install-root="$env:BUILD_DIR/vcpkg_installed" `
            --overlay-triplets=tools/custom_vcpkg_triplets `
            --triplet $env:TRIPLET
          python tools/ci/fix_vcpkg_usrlocal_prefix.py "$env:BUILD_DIR/vcpkg_installed"

      # Explicit flags rather than --preset: CMakePresets.json is gitignored in
      # this repo (.gitignore:122), so it is a per-developer file and never
      # exists in a clean checkout. A preset-based CI step cannot work here.
      # These flags are the copperai-win64 preset spelled out.
      - name: Configure
        shell: cmd
        run: |
          rem vcvars64 clobbers VCPKG_ROOT with the VS-bundled copy, so stash
          rem the real one and restore it afterwards.
          set "REAL_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VCVARS%"
          set "VCPKG_ROOT=%REAL_VCPKG_ROOT%"
          cmake -S . -B %BUILD_DIR% -G Ninja ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=%TRIPLET% ^
            -DVCPKG_OVERLAY_TRIPLETS=tools/custom_vcpkg_triplets ^
            -DVCPKG_MANIFEST_INSTALL=OFF ^
            -DKICAD_BUILD_QA_TESTS=OFF ^
            -DKICAD_SCRIPTING_WXPYTHON=ON ^
            -DKICAD_WIN32_DPI_AWARE=ON ^
            -DKICAD_IPC_API=ON ^
            -DSWIG_EXECUTABLE="%SWIG_EXECUTABLE%" ^
            -DSWIG_DIR="%SWIG_DIR%"

      - name: Build
        shell: cmd
        run: |
          set "REAL_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VCVARS%"
          set "VCPKG_ROOT=%REAL_VCPKG_ROOT%"
          cmake --build %BUILD_DIR% -- -j %BUILD_JOBS%

      - name: Verify the CopperAI webview panel linked in
        shell: pwsh
        run: |
          # On Windows the eeschema kiface is _eeschema.dll -- there are no
          # .kiface files in this build; that naming is macOS/Linux only.
          $mod = Get-ChildItem "$env:BUILD_DIR" -Recurse -Filter '_eeschema.dll' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $mod) { throw "_eeschema.dll not produced" }
          "module: $($mod.FullName)  ($('{0:N1}' -f ($mod.Length/1MB)) MB)"

          # The AI panel is the point of this fork, and a build that silently
          # drops the IPC bridge still links and still launches -- so assert the
          # bridge is really in the binary.
          #
          # These are wxS() literals, so on Windows they are stored UTF-16LE.
          # An ASCII scan finds nothing and looks like a failure.
          $bytes = [IO.File]::ReadAllBytes($mod.FullName)
          $utf16 = [Text.Encoding]::Unicode.GetString($bytes)
          $missing = @()
          foreach ($needle in @('window.kicad', 'wx_msg', 'kicad.ipc', 'chrome.webview')) {
              $n = ([regex]::Matches($utf16, [regex]::Escape($needle))).Count
              "  {0,-16} {1}" -f $needle, $n
              if ($n -eq 0) { $missing += $needle }
          }
          if ($missing) { throw "IPC bridge incomplete, missing: $($missing -join ', ')" }
          "IPC bridge present (including the WebView2 chrome.webview path)"

      # ---- packaging (tags, or manual dispatch with package_msi) ----

      - name: Install to staging tree
        if: startsWith(github.ref, 'refs/tags/v') || inputs.package_msi
        shell: cmd
        run: |
          call "%VCVARS%"
          cmake --install %BUILD_DIR% --prefix build\stage

      - name: Build MSI
        if: startsWith(github.ref, 'refs/tags/v') || inputs.package_msi
        shell: pwsh
        env:
          COPPERAI_INSTALL_ROOT: build\stage
          COPPERAI_WIX_OUT: build\msi\CopperAI.wxs
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace '.*/v','' } else { '0.0.0' }
          $env:COPPERAI_MSI_VERSION = $version
          New-Item -ItemType Directory -Force build\msi | Out-Null
          python packaging\windows\gen_copperai_wix.py
          # gen_copperai_wix.py emits the WiX v4 schema, so this needs the v4/v5
          # toolset (dotnet tool install --global wix), not legacy candle/light.
          wix build build\msi\CopperAI.wxs -o "build\msi\CopperAI-$version-win64.msi"

      - name: Upload MSI
        if: startsWith(github.ref, 'refs/tags/v') || inputs.package_msi
        uses: actions/upload-artifact@v4
        with:
          name: CopperAI-win64-msi
          path: build/msi/*.msi
          if-no-files-found: error

      - name: Collect logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.BUILD_DIR }}/vcpkg-manifest-install.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
            C:/vcpkg/buildtrees/*/*-err.log
            C:/vcpkg/buildtrees/*/*-out.log
          if-no-files-found: ignore
